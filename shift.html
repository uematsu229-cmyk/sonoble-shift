.stw{overflow-x:auto;border-radius:8px;border:1px solid var(--br)}
.stt{border-collapse:collapse;min-width:100%;white-space:nowrap}
.stt th{background:var(--ny);color:rgba(255,255,255,.8);padding:5px 3px;font-size:10px;text-align:center;border:.5px solid rgba(255,255,255,.1)}

.tc{text-align:center;vertical-align:middle;padding:2px;width:36px;min-width:36px}

function sRef(path) { return _ref(_db, 'stores/' + SK() + (path ? '/' + path : '')); }

/* 初回読み込み */
function loadStore(key, cb) {
  _get(_ref(_db, 'stores/' + key)).then(function(snap) {
    var d = snap.val();
    if (!d) {
      d = mkD();
      _set(_ref(_db, 'stores/' + key), d);
    }
    SD[key] = d;
    cb(d);
  }).catch(function(e) { alert('読み込みエラー: ' + e.message); });
}

/* 保存 */
function fbSet(path, val) {
  if (!_db) return;
  _set(sRef(path), val).then(showToast).catch(function(e) { console.error(e); });
}

/* リアルタイム同期開始 */
function startSync() {
  if (_unsub) _unsub();
  _unsub = _onValue(_ref(_db, 'stores/' + SK()), function(snap) {
    var d = snap.val();
    if (d) { SD[SK()] = d; refreshPage(); }
  });
}
function stopSync() { if (_unsub) { _unsub(); _unsub = null; } }

function refreshPage() {
  if (G.isA) {
    if (G.ct===0) rP(bIdeal());
    else if (G.ct===1) rP(bHope());
    else if (G.ct===2) rP(bConf());
    else if (G.ct===3) rP(bCost());
    else if (G.ct===4) rP(bCfg());
  } else {
    if (G.wct===0) rP(bWHome());
    else if (G.wct===1) rP(bWHope());
    else if (G.wct===2) rP(bWConf());
  }
}

/* ===== 初期化 ===== */
function iD(ym) {
  var d=D(); if(!d) return; var days=dim(ym);
  for(var day=1;day<=days;day++) {
    var date=ds(ym,day);
    if(!d.ideal) d.ideal={};
    if(!d.ideal[date]) d.ideal[date]={staffSlots:[],albSlots:[],budget:0};
    var id=d.ideal[date];
    d.fixed.forEach(function(f){
      var ok=id.staffSlots.some(function(s){return s.name===f.name;});
      if(!ok) id.staffSlots.push({name:f.name,start:SDEF,end:''});
    });
    ALBDEF.forEach(function(a,ai){if(!id.albSlots[ai]) id.albSlots.push({start:a.start,end:a.end});});
  }
}

function tB(s,e,c) { if(!s) return '<span class="bem">\u2500</span>'; var t=e?(fTS(s)+'\u301C'+fTS(e)):fTS(s)+'\u301C'; return '<span class="bar2 '+c+'">'+t+'</span>'; }

  d.workers.forEach(function(w){

    for(var day=st;day<=en;day++){
      var dt=ds(G.mo,day),dn=+dt.split('-')[2],per=dn<=15?1:2;

/* ===== 人件費 ===== */
function calcLab(d) {
  var days=dim(G.mo),fl=0;
  d.workers.forEach(function(w){for(var day=1;day<=days;day++){var dt=ds(G.mo,day); if(d.confirmed&&d.confirmed[dt]) d.confirmed[dt].forEach(function(c){if(c.type==='worker'&&c.wid===w.id) fl+=wage(c.start,c.end,w.hourly);});}});
  var fx=0; d.fixed.forEach(function(f){fx+=f.monthly;});
  return {fl:fl,fx:fx,tot:fl+fx};
}
function bCost() {
  var d=D(); if(!d) return '';
  var lab=calcLab(d),bgt=G.bc||3200000;
  var rt=bgt>0?((lab.tot/bgt)*100).toFixed(1):0,rtN=+rt;
  var rc=rtN<25?'#10b981':rtN<30?'#f59e0b':'#ef4444'; var bw=Math.min(rtN,50)*2;
  var days=dim(G.mo),wR='',gr=0;

function gHp(dt){var d=D();if(!d)return[];var r=[];d.workers.forEach(function(w){var ws=d.shifts&&d.shifts[w.id];if(!ws)return;var dn=+dt.split('-')[2],per=dn<=15?1:2;var pd=ws[per];if(!pd||!pd[dt])return;var h=pd[dt];r.push({wid:w.id,name:w.name,start:h.start,end:h.end,ng:h.ng});});return r;}
function tC(dt,wid){var d=D();if(!d)return;if(!d.confirmed)d.confirmed={};if(!d.confirmed[dt])d.confirmed[dt]=[];var idx=d.confirmed[dt].findIndex(function(x){return x.type==='worker'&&x.wid===wid;});if(idx>=0)d.confirmed[dt].splice(idx,1);else{var w=d.workers.filter(function(x){return x.id===wid;})[0];var dn=+dt.split('-')[2],per=dn<=15?1:2;var ws=d.shifts&&d.shifts[wid];var hh=ws&&ws[per]&&ws[per][dt];d.confirmed[dt].push({type:'worker',wid:wid,name:w.name,start:hh&&hh.start||'',end:hh&&hh.end||''});}g('mbdy').innerHTML=bMM(dt);}
function tSt(dt,n){var d=D();if(!d)return;if(!d.confirmed)d.confirmed={};if(!d.confirmed[dt])d.confirmed[dt]=[];var idx=d.confirmed[dt].findIndex(function(x){return x.type==='staff'&&x.name===n;});if(idx>=0)d.confirmed[dt].splice(idx,1);else d.confirmed[dt].push({type:'staff',name:n,start:SDEF,end:''});g('mbdy').innerHTML=bMM(dt);}
function uC(dt,ri,f,v){var d=D();if(d&&d.confirmed&&d.confirmed[dt]&&d.confirmed[dt][ri])d.confirmed[dt][ri][f]=v;}
function rC(dt,ri){var d=D();if(!d)return;if(!d.confirmed||!d.confirmed[dt])return;d.confirmed[dt].splice(ri,1);g('mbdy').innerHTML=bMM(dt);}
function tIS(dt,fi,ck){var d=D();if(!d)return;if(!d.ideal)d.ideal={};if(!d.ideal[dt])d.ideal[dt]={staffSlots:[],albSlots:[],budget:0};var f=d.fixed[fi],id=d.ideal[dt];var idx=id.staffSlots.findIndex(function(s){return s.name===f.name;});if(ck&&idx<0)id.staffSlots.push({name:f.name,start:SDEF,end:''});else if(!ck&&idx>=0)id.staffSlots.splice(idx,1);}
function sIS(dt,fi,fld,v){var d=D();if(!d||!d.ideal||!d.ideal[dt])return;var sl=d.ideal[dt].staffSlots.filter(function(s){return s.name===d.fixed[fi].name;})[0];if(sl)sl[fld]=v;}
function addIA(dt){var d=D();if(!d)return;if(!d.ideal)d.ideal={};if(!d.ideal[dt])d.ideal[dt]={staffSlots:[],albSlots:[],budget:0};var ai=d.ideal[dt].albSlots.length;var def=ALBDEF[ai]||{start:'17:00',end:'22:00'};d.ideal[dt].albSlots.push({start:def.start,end:def.end});g('mbdy').innerHTML=bIM(dt);}
function rmIA(dt,ai){var d=D();if(!d)return;d.ideal[dt].albSlots.splice(ai,1);g('mbdy').innerHTML=bIM(dt);}
function sIA(dt,ai,fld,v){var d=D();if(!d||!d.ideal||!d.ideal[dt]||!d.ideal[dt].albSlots[ai])return;d.ideal[dt].albSlots[ai][fld]=v;}
function sIb(dt,v){var d=D();if(!d)return;if(!d.ideal)d.ideal={};if(!d.ideal[dt])d.ideal[dt]={staffSlots:[],albSlots:[],budget:0};d.ideal[dt].budget=+v||0;}
